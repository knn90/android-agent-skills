# Provenance + curation for the android-tdd skill.
# Maintained by android-skill-consolidate — do not hand-edit pinned_commit / last_synced.

skill: android-tdd
domain: Test-driven development discipline (red-green-refactor, prove-it, vertical slices) — process, not framework mechanics
last_consolidated:   # not yet consolidated

# Scope note: framework SEMANTICS (JUnit4/JUnit5, MockK, Turbine, runTest/coroutines-test,
# Robolectric, Compose UI test, doubles, migration, parallelization) are OWNED by
# android-testing-expert. android-tdd consolidates the *process* only and cross-links there.
# Keep the two from overlapping when re-consolidating.

discovery:
  enabled: true
  queries:
    - "test-driven development agent skill"
    - "TDD red green refactor best practices"
    - "tracer bullet vertical slice TDD"
    - "test behavior not implementation"
    - "DAMP not DRY tests"
  authority_anchors:
    - "Kent Beck — Test-Driven Development by Example"
    - "Google Testing Blog / Software Engineering at Google — test sizes, DAMP, state vs interaction"
    - "Martin Fowler — test double taxonomy, refactoring"
    - "Android Developers — Guide to app architecture (testing) + Test your app guides"

sources:
  # ── Community discovery seeds (fetch + pin on first android-skill-consolidate run) ──
  - name: addyosmani/agent-skills — test-driven-development
    url: https://github.com/addyosmani/agent-skills
    path: skills/test-driven-development/
    status: seed
    pinned_commit:              # pin on first android-skill-consolidate run
    last_synced:
    license: MIT
    note: >
      Primary structural seed — TDD cycle, Prove-It pattern, test pyramid + test sizes,
      good-test rules (state-not-interaction, DAMP, real>mocks, AAA), anti-patterns,
      rationalizations, red flags. The "Browser Testing with DevTools / Chrome MCP" section is
      intentionally DROPPED (not Android-relevant) — replaced by run-the-suite / emulator guidance.

  - name: mattpocock/skills — engineering/tdd
    url: https://github.com/mattpocock/skills
    path: skills/engineering/tdd/
    also:
      - https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/tests.md       # → references/tests.md
      - https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/mocking.md     # → references/mocking.md
      - https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/refactoring.md # → references/refactoring.md
    status: seed
    pinned_commit:              # pin on first android-skill-consolidate run
    last_synced:
    license: MIT
    note: >
      Seed for the vertical-slice / tracer-bullet framing (horizontal slicing as the cardinal
      anti-pattern), "never refactor while RED", behavior-through-public-interface emphasis, and
      the plan-the-behaviors / you-can't-test-everything planning step. The three companion files
      (tests/mocking/refactoring) were rewritten Kotlin-native into references/ — mocking.md keeps
      the *decision* (boundaries + DI + SDK-style interfaces) and defers the double taxonomy +
      fake/fixture placement to android-testing-expert §8 to avoid duplication.

# ── Notes ──
# Description slimmed to triggers + leading words; "Red flags" merged into the Anti-patterns table;
# "Rationalizations" section and the test-size table dropped as no-ops (android-execute already
# mandates TDD; the pyramid diagram covers sizes). Keep these out on re-consolidation.
# Examples were rewritten Kotlin-native (JUnit + Truth assertions, MockK, Turbine, runTest,
# BigDecimal for money, view-model StateFlow not Composable).
# Framework mechanics deliberately deferred to android-testing-expert to avoid duplication.
# On the first real android-skill-consolidate run: fetch both repos at HEAD, fill the two
# pinned_commit fields, and consider the official Android "Test your app" guides + android/nowinandroid
# test suite as authority anchors for any Android-specific test-flow guidance.
