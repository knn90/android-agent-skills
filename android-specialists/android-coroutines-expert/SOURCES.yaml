# Provenance + curation for the android-coroutines-expert skill.
# Maintained by android-skill-consolidate — do not hand-edit pinned_commit / last_synced.

skill: android-coroutines-expert
domain: Kotlin Coroutines & Flow (structured concurrency, dispatchers/main-safety, cancellation, StateFlow/SharedFlow, lifecycle-aware collection)
last_consolidated:   # not yet consolidated

discovery:
  enabled: true
  queries:                     # seeds for the discovery step (current year appended at run time)
    - "Kotlin coroutines best practices"
    - "Android coroutines best practices main-safety"
    - "structured concurrency coroutineScope supervisorScope"
    - "StateFlow SharedFlow stateIn shareIn WhileSubscribed"
    - "Flow context preservation flowOn channelFlow"
    - "coroutine cancellation cooperative ensureActive NonCancellable"
    - "repeatOnLifecycle collectAsStateWithLifecycle"
    - "suspendCancellableCoroutine callbackFlow bridging callbacks"
    - "Mutex withLock coroutines shared mutable state"
  authority_anchors:           # always weighted top for currency (language + first-party library)
    - "Kotlin Coroutines guide (kotlinlang.org)"
    - "kotlinx.coroutines API reference & README"
    - "Android Developers — Coroutines best practices"
    - "Android Developers — Kotlin flows on Android / background work"

sources:
  # ── PRIMARY / SOURCE OF TRUTH: Kotlin + kotlinx.coroutines + Android official docs ──
  - name: Kotlin — official Coroutines guide (kotlinlang.org)
    url: https://kotlinlang.org/docs/coroutines-guide.html
    also:
      - https://kotlinlang.org/docs/coroutines-basics.html
      - https://kotlinlang.org/docs/cancellation-and-timeouts.html
      - https://kotlinlang.org/docs/composing-suspending-functions.html
      - https://kotlinlang.org/docs/coroutine-context-and-dispatchers.html
      - https://kotlinlang.org/docs/flow.html
      - https://kotlinlang.org/docs/shared-mutable-state-and-concurrency.html
    path: .
    status: active
    primary: true              # ranked first; the authoritative source of truth
    consulted_version: "kotlinx.coroutines 1.8+/1.9, Kotlin 2.x / K2 era"
    license: "Kotlin Foundation / Apache-2.0 — reference; cite, write original guidance"
    note: >
      Authoritative for suspend semantics, structured concurrency (scope/Job tree), dispatchers,
      cooperative cancellation, Mutex, and Flow (cold vs hot, context preservation, operators).
      Semantics here win on any conflict with community idioms.

  - name: kotlinx.coroutines — library docs & API reference (Kotlin/JetBrains)
    url: https://kotlinlang.org/api/kotlinx.coroutines/
    also:
      - https://github.com/Kotlin/kotlinx.coroutines
      - https://github.com/Kotlin/kotlinx.coroutines/blob/master/kotlinx-coroutines-core/README.md
    path: .
    status: active
    primary: true
    license: "Apache-2.0 — reference"
    note: "Authoritative for StateFlow/SharedFlow, SharingStarted.WhileSubscribed, channelFlow/callbackFlow, suspendCancellableCoroutine, buffer/conflate, limitedParallelism, NonCancellable."

  - name: Android Developers — Coroutines & Flow best practices
    url: https://developer.android.com/kotlin/coroutines/coroutines-best-practices
    also:
      - https://developer.android.com/kotlin/coroutines
      - https://developer.android.com/kotlin/flow
      - https://developer.android.com/topic/libraries/architecture/coroutines
      - https://developer.android.com/topic/architecture/ui-layer#stateflow
      - https://developer.android.com/develop/ui/compose/state#use-other-types-of-state-in-jetpack-compose
    path: .
    status: active
    primary: true
    license: "Google / Android Open Source — reference / learn-from only; never vendor verbatim"
    note: >
      Authoritative for the Android specifics: main-safety, inject dispatchers, don't expose mutable
      types, viewModelScope/lifecycleScope, repeatOnLifecycle / collectAsStateWithLifecycle,
      stateIn/WhileSubscribed for UI state, avoiding GlobalScope/runBlocking on the main thread.

  # ── Community / library sources — DISCOVERY SEEDS (not yet fetched or pinned) ──
  # android-skill-consolidate will fetch + pin these on first real consolidation.
  - name: android/nowinandroid — coroutines/Flow architecture patterns
    url: https://github.com/android/nowinandroid
    path: seed
    status: seed
    last_synced:               # not yet fetched
    license: Apache-2.0
    note: "Google reference sample; canonical for stateIn(WhileSubscribed), injected dispatchers, and lifecycle-aware collection. Seed only — verify + pin on consolidation."

  - name: android/architecture-samples — StateFlow UiState / repository patterns
    url: https://github.com/android/architecture-samples
    path: seed
    status: seed
    last_synced:
    license: Apache-2.0
    note: "Seed only — verify + pin on consolidation."

  - name: Kotlin/kotlinx.coroutines — README / guide sources (community-facing)
    url: https://github.com/Kotlin/kotlinx.coroutines
    path: seed
    status: seed
    last_synced:
    license: Apache-2.0
    note: "First-party library repo; treated as primary above, listed here as a fetch seed for consolidation to pin a commit."

